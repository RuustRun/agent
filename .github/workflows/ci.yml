# CI for the Ruust agent: build and test every push and pull request, and on a
# green build of main, automatically tag and publish the next patch release. The
# control plane serves whichever version it is pinned to (RUUST_AGENT_VERSION), so
# an auto-release only makes a new version AVAILABLE; the fleet moves when that pin
# is bumped. Add "[skip release]" to a commit message to build and test without
# releasing.
#
# British English throughout. No em dashes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  release:
    name: Auto-release
    needs: test
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can read the latest tag to bump from.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compute next version (bump patch)
        id: v
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            v="${latest#v}"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${next} (previous: ${latest:-none})"

      - name: Build static binaries and checksums
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.agentVersion=${{ steps.v.outputs.version }}" \
              -o "dist/ruust-agent-linux-$arch" ./cmd/agent
            # Publish a bare sha256 next to each binary. The agent fetches it and
            # verifies the download before it will install and exec the new build.
            sha256sum "dist/ruust-agent-linux-$arch" | awk '{print $1}' > "dist/ruust-agent-linux-$arch.sha256"
          done
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/ruust-agent-linux-*
